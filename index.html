<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中聚 FOCUSPOLY｜2026 产品 Catalog</title>
  <link rel="icon" href="./apple-catalog-assets/favicon.png" />
  <style>
    :root {
      --paper: #fbfbfd;
      --white: #ffffff;
      --mist: #f5f6f8;
      --mist-2: #eef1f5;
      --ink: #10131a;
      --muted: #657083;
      --faint: #9aa3b1;
      --line: rgba(10, 24, 45, .11);
      --blue: #0057b8;
      --blue-deep: #073a77;
      --pink: #f51b6b;
      --wine: #aa001b;
      --rose: #fff0f5;
      --shadow: 0 28px 90px rgba(13, 37, 73, .12);
      --soft-shadow: 0 18px 45px rgba(13, 37, 73, .08);
      --ease: cubic-bezier(.16, 1, .3, 1);
      --display: "Avenir Next", "SF Pro Display", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      --body: "Avenir Next", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: var(--body);
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(245, 27, 107, .09), transparent 28%),
        radial-gradient(circle at 86% 6%, rgba(0, 87, 184, .11), transparent 32%),
        linear-gradient(135deg, #ffffff 0%, #f7f8fb 54%, #eef2f7 100%);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 87, 184, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 87, 184, .03) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 70% 30%, #000 0, transparent 58%);
      opacity: .45;
    }

    .orb {
      position: fixed;
      width: 42vw;
      aspect-ratio: 1;
      right: -18vw;
      top: -22vw;
      pointer-events: none;
      background: conic-gradient(from 210deg, var(--pink), #a343b9, var(--blue), var(--pink));
      filter: blur(40px);
      opacity: .16;
      border-radius: 50%;
      animation: floatOrb 10s var(--ease) infinite alternate;
    }
    @keyframes floatOrb { to { transform: translate3d(-4vw, 5vh, 0) scale(1.05); } }

    .deck {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.06fr) minmax(360px, .64fr);
      gap: clamp(34px, 4.2vw, 62px);
      align-items: center;
      padding: clamp(64px, 8vw, 108px) clamp(70px, 8vw, 122px) clamp(62px, 6vw, 86px);
      opacity: 0;
      visibility: hidden;
      transform: translate3d(5vw, 0, 0) scale(.985);
      transition: opacity .65s var(--ease), transform .82s var(--ease), visibility .65s;
    }
    .slide.active {
      opacity: 1;
      visibility: visible;
      transform: translate3d(0, 0, 0) scale(1);
    }
    .slide.prior { transform: translate3d(-5vw, 0, 0) scale(.985); }
    .slide.full { grid-template-columns: 1fr; }
    .slide.cover-slide { grid-template-columns: minmax(0, 1fr) minmax(420px, .58fr); }

    .topbar {
      position: fixed;
      z-index: 20;
      top: 24px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: .02em;
    }
    .brand-mini {
      display: inline-flex;
      align-items: center;
      height: 42px;
      color: var(--blue-deep);
      font-weight: 800;
    }
    .brand-mini img {
      width: auto;
      height: 38px;
      max-width: 186px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 22px rgba(7,58,119,.055));
    }

    .copy { max-width: 900px; position: relative; z-index: 2; }
    .slide.full .copy { max-width: min(1120px, 100%); }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      color: var(--blue-deep);
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: clamp(12px, 1vw, 15px);
    }
    .eyebrow::before {
      content: none;
    }
    h1, h2 {
      margin: 0;
      font-family: var(--display);
      letter-spacing: -.045em;
      line-height: .96;
      color: var(--ink);
    }
    h1 { font-size: clamp(56px, 5.2vw, 78px); max-width: none; white-space: nowrap; }
    h2 { font-size: clamp(44px, 4.3vw, 66px); max-width: none; white-space: nowrap; }
    .slide:not(.full) h2 { font-size: clamp(40px, 3.7vw, 58px); max-width: none; }
    .cover-slide h1 { font-size: clamp(58px, 5.15vw, 74px); letter-spacing: -.06em; }
    .en {
      margin-top: 18px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: clamp(12px, 1.15vw, 17px);
    }
    .lead {
      margin: clamp(28px, 4vh, 48px) 0 0;
      max-width: 650px;
      color: #263243;
      font-size: clamp(22px, 2vw, 32px);
      line-height: 1.46;
      font-weight: 700;
    }
    .subcopy {
      margin-top: 18px;
      max-width: 640px;
      color: var(--muted);
      font-size: clamp(15px, 1.2vw, 19px);
      line-height: 1.85;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }
    .tag {
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .72);
      color: var(--blue-deep);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(13, 37, 73, .04);
    }

    .hero-logo {
      width: min(640px, 100%);
      display: block;
      filter:
        drop-shadow(0 22px 34px rgba(7, 58, 119, .13))
        drop-shadow(0 2px 0 rgba(255,255,255,.46));
    }
    .hero-icon-large { display: none; }
    .hero-visual {
      position: relative;
      min-height: 360px;
      border-radius: 46px;
      overflow: visible;
      background: transparent;
      border: 0;
      box-shadow: none;
      isolation: isolate;
    }
    .hero-visual::before {
      content: "";
      position: absolute;
      inset: -13% -11%;
      z-index: -1;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 48% 46%, rgba(255,255,255,.74) 0 30%, transparent 64%),
        radial-gradient(ellipse at 20% 12%, rgba(245,27,107,.12), transparent 46%),
        radial-gradient(ellipse at 78% 82%, rgba(0,87,184,.14), transparent 54%);
      filter: blur(18px);
      opacity: .95;
    }
    .hero-visual img {
      width: 100%;
      height: 100%;
      min-height: 360px;
      display: block;
      object-fit: cover;
      border-radius: 46px;
      box-shadow: 0 34px 84px rgba(13, 37, 73, .14);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 0 63%, rgba(0,0,0,.86) 76%, transparent 100%);
      mask-image: radial-gradient(ellipse at center, #000 0 63%, rgba(0,0,0,.86) 76%, transparent 100%);
      transform: scale(1.035);
      transition: transform 1s var(--ease);
    }
    .slide.active .hero-visual img { transform: scale(1); }
    .hero-visual::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 46px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.22), transparent 34%, rgba(0,87,184,.10)),
        radial-gradient(circle at 16% 12%, rgba(245,27,107,.12), transparent 38%);
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse at center, #000 0 66%, transparent 100%);
      mask-image: radial-gradient(ellipse at center, #000 0 66%, transparent 100%);
    }
    .caption {
      position: absolute;
      left: 24px;
      bottom: 22px;
      z-index: 2;
      color: var(--white);
      text-shadow: 0 2px 18px rgba(0,0,0,.38);
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      font-size: 13px;
    }

    .cover-grid {
      position: relative;
      display: grid;
      gap: 18px;
    }
    .cover-image-slide {
      display: block;
      padding: 0;
      background: #f1f1f1;
      overflow: hidden;
    }
    .cover-image-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    body.cover-mode .topbar,
    body.cover-mode .nav-dots,
    body.cover-mode .controls,
    body.cover-mode .progress,
    body.cover-mode .orb {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .cover-slide .cover-grid { transform: translateY(96px); }
    .cover-slide .hero-logo { width: min(520px, 100%); }
    .logo-panel {
      position: relative;
      padding: 18px 0 10px;
      border-radius: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
    }
    .logo-panel::before {
      content: "";
      position: absolute;
      inset: -18% -10%;
      z-index: -1;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 50% 44%, rgba(255,255,255,.82), transparent 60%),
        radial-gradient(ellipse at 18% 30%, rgba(245,27,107,.10), transparent 46%),
        radial-gradient(ellipse at 84% 64%, rgba(0,87,184,.12), transparent 54%);
      filter: blur(22px);
      opacity: .9;
    }
    .cover-ribbon {
      position: absolute;
      right: 2%;
      bottom: -15%;
      width: 78%;
      height: 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue-deep), var(--blue), var(--pink));
      transform: rotate(-26deg);
      opacity: .85;
      filter: blur(.2px);
      box-shadow: 0 22px 55px rgba(0,87,184,.2);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 38px;
      max-width: 760px;
    }
    .metric, .card, .logo-card, .step {
      position: relative;
      border-radius: 26px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: var(--soft-shadow);
      overflow: hidden;
    }
    .metric { padding: 26px; min-height: 145px; }
    .metric strong {
      display: block;
      font-size: clamp(48px, 5vw, 84px);
      line-height: .9;
      letter-spacing: -.06em;
      color: var(--blue-deep);
      white-space: nowrap;
    }
    .metric span { display: block; margin-top: 13px; color: var(--muted); font-weight: 700; }
    .metric.accent strong { color: var(--wine); }

    .route-list {
      display: grid;
      gap: 0;
      margin-top: 34px;
      max-width: 840px;
      border-top: 1px solid var(--line);
    }
    .route {
      display: grid;
      grid-template-columns: 72px 1fr 1.35fr;
      gap: 22px;
      align-items: baseline;
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
    }
    .route .idx { color: var(--pink); font-weight: 900; font-size: 18px; }
    .route b { color: var(--ink); font-size: clamp(20px, 1.7vw, 27px); letter-spacing: -.02em; }
    .route span { color: var(--muted); line-height: 1.55; font-size: 17px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .title-motion-icon {
      width: auto;
      height: 1.18em;
      object-fit: contain;
      display: inline-block;
      transform: translateY(.04em);
    }

    .profile-slide {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
      gap: 20px;
      align-items: start;
      padding: 92px 122px 46px;
    }
    .profile-kicker {
      color: var(--wine);
      font-size: 14px;
      font-weight: 850;
      letter-spacing: .26em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .profile-slide h2 {
      margin-top: 10px;
      font-size: clamp(25px, 2.15vw, 34px);
      line-height: .96;
      letter-spacing: -.055em;
    }
    .profile-slogan {
      margin: 14px 0 0;
      max-width: none;
      white-space: normal;
      background: linear-gradient(90deg, var(--pink) 0%, #8b2ab5 48%, var(--blue) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: clamp(58px, 5.55vw, 86px);
      line-height: .88;
      letter-spacing: -.06em;
      font-weight: 900;
    }
    .profile-slogan .break {
      display: block;
    }
    .profile-slogan span {
      color: inherit;
    }
    .profile-body {
      margin-top: 14px;
      max-width: 900px;
      color: #344056;
      font-size: 16.5px;
      line-height: 1.52;
      font-weight: 640;
    }
    .profile-body-en {
      margin: 9px 0 0;
      max-width: 1120px;
      color: #677286;
      font-size: 15.2px;
      line-height: 1.42;
      font-weight: 640;
    }
    .profile-values {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
    }
    .profile-value-card {
      position: relative;
      overflow: hidden;
      padding: 22px 24px 20px;
      border-radius: 30px;
      background:
        radial-gradient(circle at 0% 0%, rgba(255,0,113,.075), transparent 46%),
        linear-gradient(145deg, rgba(255,255,255,.88), rgba(244,248,255,.68));
      border: 1px solid rgba(255,255,255,.94);
      box-shadow: 0 22px 54px rgba(13,37,73,.07);
    }
    .profile-value-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 24px;
      bottom: 24px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--pink), var(--blue));
    }
    .profile-value-card h3 {
      margin: 0;
      color: var(--ink);
      font-size: 23px;
      letter-spacing: -.04em;
    }
    .profile-value-card h3 span {
      display: block;
      margin: 6px 0 0;
      color: var(--wine);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .profile-value-card p {
      margin: 11px 0 0;
      color: #303b4f;
      font-size: 16px;
      line-height: 1.45;
      font-weight: 750;
    }
    .profile-value-card small {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12.2px;
      line-height: 1.45;
      font-weight: 650;
    }

    .logo-wall {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 17px;
      margin-top: 34px;
    }
    .logo-card {
      height: 132px;
      display: grid;
      grid-template-rows: 1fr auto;
      place-items: center;
      gap: 8px;
      padding: 20px 22px 16px;
      background: rgba(255,255,255,.82);
      transition: transform .45s var(--ease), box-shadow .45s var(--ease);
    }
    .logo-card img {
      max-width: 78%;
      max-height: 44px;
      object-fit: contain;
      display: block;
    }
    .logo-card.logo-lg img { max-width: 82%; max-height: 44px; }
    .logo-card.logo-auser img { max-width: 76%; max-height: 38px; }
    .logo-card.logo-invista img { max-width: 86%; max-height: 42px; }
    .logo-card.logo-kumho img { max-width: 90%; max-height: 34px; }
    .logo-card.logo-trinseo img { max-width: 80%; max-height: 38px; }
    .logo-card .word {
      font-size: 24px;
      color: var(--wine);
      font-weight: 900;
      letter-spacing: .03em;
    }
    .logo-card-name {
      color: #566277;
      font-size: 12px;
      font-weight: 760;
      letter-spacing: .04em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
    }
    .brand-note {
      margin-top: 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }
    .partners-slide {
      padding-top: 82px;
      padding-bottom: 54px;
      align-items: start;
    }
    .partners-slide .copy { max-width: 820px; }
    .partners-slide h2 { font-size: clamp(44px, 4.1vw, 66px); }
    .partners-slide .en { margin-top: 7px; }
    .partners-slide .lead {
      margin-top: 30px;
      max-width: 930px;
      font-size: clamp(23px, 1.9vw, 30px);
      line-height: 1.22;
    }
    .partners-slide .subcopy {
      margin-top: 16px;
      font-size: 17px;
    }
    .partners-slide .logo-wall {
      margin-top: -32px;
      gap: 14px;
    }
    .partners-slide {
      gap: 0;
    }
    .partners-slide .logo-card {
      height: 106px;
      padding: 16px 20px 12px;
    }
    .partners-slide .logo-card img {
      max-height: 38px;
    }
    .partners-slide .brand-note {
      margin-top: 12px;
      font-size: 12.5px;
      line-height: 1.4;
    }

    .catalog-board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 34px;
    }
    .catalog-section {
      padding: 24px;
      border-radius: 28px;
      background: rgba(255,255,255,.62);
      box-shadow: var(--soft-shadow);
      border: 1px solid rgba(255,255,255,.92);
    }
    .catalog-section h3 {
      margin: 0 0 16px;
      color: var(--wine);
      font-size: 26px;
      letter-spacing: -.03em;
    }
    .catalog-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
    }
    .catalog-item {
      padding: 10px 0;
      border-top: 1px solid rgba(7,58,119,.1);
    }
    .catalog-item b {
      display: block;
      color: var(--blue-deep);
      font-size: 15px;
      margin-bottom: 5px;
    }
    .catalog-item span {
      color: #273246;
      font-size: 14px;
      line-height: 1.45;
    }

    .segments-slide,
    .service-slide,
    .customers-slide {
      padding-top: 72px;
      padding-bottom: 52px;
      align-items: start;
      gap: 18px;
    }
    .segments-slide .copy,
    .service-slide .copy,
    .customers-slide .copy { max-width: 1040px; }
    .segments-slide h2,
    .service-slide h2,
    .customers-slide h2 { font-size: clamp(40px, 3.45vw, 54px); }
    .segments-slide .en,
    .service-slide .en,
    .customers-slide .en { margin-top: 8px; }
    .segments-slide .lead,
    .service-slide .lead,
    .customers-slide .lead {
      max-width: 920px;
      margin-top: 28px;
      font-size: clamp(21px, 1.78vw, 27px);
      line-height: 1.32;
    }
    .segments-slide .lead,
    .customers-slide .lead { max-width: 1240px; }

    .segment-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      margin-top: 16px;
    }
    .segment-card {
      position: relative;
      overflow: hidden;
      min-height: 372px;
      border-radius: 38px;
      background:
        radial-gradient(circle at 78% 4%, rgba(21,102,193,.14), transparent 40%),
        radial-gradient(circle at 12% 0%, rgba(255,0,113,.08), transparent 44%),
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(246,250,255,.76));
      border: 1px solid rgba(255,255,255,.92);
      box-shadow: var(--soft-shadow);
      isolation: isolate;
    }
    .segment-card::before {
      content: "";
      position: absolute;
      inset: auto 24px 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(170,0,27,.35), rgba(7,58,119,.32), transparent);
      z-index: 2;
    }
    .segment-visual {
      position: absolute;
      inset: 8px 8px auto;
      height: 142px;
      overflow: visible;
      background:
        radial-gradient(circle at 55% 54%, rgba(255,255,255,.9), transparent 54%),
        radial-gradient(circle at 50% 64%, rgba(21,102,193,.10), transparent 58%);
      mask-image: none;
    }
    .segment-visual img {
      width: 100%;
      height: 158px;
      object-fit: contain;
      opacity: .94;
      filter: saturate(1.02) contrast(1.02) drop-shadow(0 22px 36px rgba(13,37,73,.10));
      transform: translateY(2px) scale(.94);
    }
    .segment-content {
      position: relative;
      z-index: 2;
      padding: 142px 30px 26px;
    }
    .segment-index {
      display: none;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      margin-bottom: 13px;
      color: white;
      font-weight: 900;
      font-size: 13px;
      background: linear-gradient(135deg, var(--wine), var(--blue));
      box-shadow: 0 10px 22px rgba(170,0,27,.14);
    }
    .segment-card h3 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(24px, 1.95vw, 31px);
      letter-spacing: -.045em;
      line-height: 1;
    }
    .segment-card .segment-en {
      margin-top: 6px;
      color: var(--wine);
      font-size: 14px;
      font-family: var(--body);
      font-weight: 520;
      letter-spacing: .01em;
    }
    .segment-card ul {
      list-style: none;
      margin: 16px 0 0;
      padding: 0;
      display: grid;
      gap: 9px;
    }
    .segment-card li {
      display: flex;
      align-items: baseline;
      gap: 10px;

    .qr {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(7,58,119,.22);
      border-radius: 34px;
      background: linear-gradient(135deg, #fff, #f2f5fa);
      box-shadow: var(--soft-shadow);
      font-size: 24px;
      font-weight: 800;
      line-height: 1.45;
    }

    .nav-dots {
      position: fixed;
      z-index: 22;
      left: 26px;
      top: 50%;
      transform: translateY(-50%);
      display: grid;
      gap: 8px;
    }
    .dot {
      position: relative;
      width: 8px;
      height: 8px;
      border-radius: 999px;
      padding: 0;
      border: 0;
      background: rgba(7,58,119,.18);
      cursor: pointer;
      transition: transform .2s var(--ease), background .2s var(--ease);
    }
    .dot.active {
      background: linear-gradient(135deg, var(--pink), var(--blue));
      transform: scale(1.55);
    }
    .dot span {
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      width: max-content;
      max-width: 260px;
      padding: 8px 11px;
      color: var(--ink);
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.94);
      border-radius: 12px;
      box-shadow: var(--soft-shadow);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s var(--ease);
    }
    .dot:hover span { opacity: 1; }

    .controls {
      position: fixed;
      right: 26px;
      bottom: 34px;
      z-index: 22;
      display: flex;
      gap: 10px;
    }
    button.ctrl {
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,.82);
      color: var(--blue-deep);
      box-shadow: var(--soft-shadow);
      cursor: pointer;
      font-weight: 900;
      transition: transform .2s var(--ease), background .2s var(--ease);
    }
    button.ctrl.fullscreen-ctrl {
      display: grid;
      place-items: center;
      font-size: 18px;
      line-height: 1;
    }
    button.ctrl.fullscreen-ctrl.active {
      color: var(--white);
      border-color: transparent;
      background: linear-gradient(135deg, var(--blue-deep), var(--blue));
      box-shadow: 0 18px 42px rgba(7,58,119,.18);
    }
    button.ctrl.fullscreen-ctrl.unsupported {
      opacity: .45;
      cursor: not-allowed;
    }
    button.ctrl:hover { transform: translateY(-2px); background: var(--white); }
    button.ctrl.fullscreen-ctrl.unsupported:hover { transform: none; background: rgba(255,255,255,.82); }
    .progress {

    const qrGrid = s => `<div class="qr-grid">${s.qrs.map(q=>`<div class="qr-card"><img src="${A + q[0]}" alt="${esc(q[1])}二维码"><h3>${esc(q[1])}</h3></div>`).join('')}</div>`;
    const yonghongAsa = s => `${header(s)}<p class="lead">${esc(s.lead)}</p></div><div class="yh-asa-stage"><div class="yh-copy-stack"><div class="yh-badge">Yonghong ASA</div><div class="yh-grade-grid">${s.grades.map(g=>`<article class="yh-grade-card ${g.featured ? 'featured' : ''}"><div class="yh-grade-head"><div class="yh-grade-name">${esc(g.name)}</div><div class="yh-grade-route">${esc(g.route)}</div></div><p>${esc(g.desc)}</p><span>${esc(g.use)}</span></article>`).join('')}</div><div class="yh-app-stack">${s.apps.map(a=>`<div class="yh-app-pill">${esc(a)}</div>`).join('')}</div><div class="yh-property-table"><div class="yh-property-row head">${s.propertyColumns.map(c=>`<b>${esc(c)}</b>`).join('')}</div>${s.propertyRows.map(r=>`<div class="yh-property-row">${r.map((c,i)=> i === 0 ? `<b>${esc(c)}</b>` : `<span>${esc(c)}</span>`).join('')}</div>`).join('')}</div></div><div class="yh-application-art" aria-hidden="true"><img class="yh-art-grille" src="${A + s.visuals[0][0]}" alt="${esc(s.visuals[0][1])}"><img class="yh-art-window" src="${A + s.visuals[1][0]}" alt="${esc(s.visuals[1][1])}"><div class="yh-art-glow"></div></div></div>`;
    const heatPerformanceChart = rows => {
      const w = 540, h = 348;
      const m = { left: 66, right: 28, top: 36, bottom: 64 };
      const minDose = 0, maxDose = 60, minVst = 90, maxVst = 140;
      const x = v => m.left + ((Number(v) - minDose) / (maxDose - minDose)) * (w - m.left - m.right);
      const y = v => m.top + ((maxVst - Number(v)) / (maxVst - minVst)) * (h - m.top - m.bottom);
      const xTicks = [0, 10, 20, 30, 40, 50, 60];
      const yTicks = [90, 100, 110, 120, 130, 140];

        const color = esc(series.color);

          return `<path class="series-marker triangle" d="M ${px.toFixed(1)} ${(py - 8).toFixed(1)} L ${(px - 7.5).toFixed(1)} ${(py + 6.5).toFixed(1)} L ${(px + 7.5).toFixed(1)} ${(py + 6.5).toFixed(1)} Z" fill="${color}"></path>`;

      const series = rows.map(r => {
        const coords = r.points.map(p => [x(p[0]), y(p[1]), p[0], p[1]]);
        const path = coords.map((p, i) => `${i ? 'L' : 'M'} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
        const last = coords[coords.length - 1];
        const labelOffsets = {
          'MS-NB': [10, -13, 'start'],
          'MS-NI': [12, -1, 'start'],
          'AMSAN': [-58, 17, 'end']
        };
        const labelOffset = labelOffsets[r.short] || [10, -8, 'start'];
        return `<g class="series ${esc(r.short).toLowerCase()}">
          <title>${esc(r.name)}｜${esc(r.note)}</title>
          <path class="series-line" d="${path}" stroke="${esc(r.color)}"></path>
          ${coords.map(p=>`<g><title>${esc(r.short)}：${esc(p[2])}% / ${esc(p[3])}℃</title>${marker(r, p[0], p[1])}</g>`).join('')}

        ${series}
      </svg></div><div class="heat-chart-legend line-note"><span>MS-NB / MS-CP：IP +1% ≒ Vicat +0.7℃</span><span>MS-NI / MS-NIP：IP +1% ≒ Vicat +0.65℃</span></div>`;
    };
    const heatTopic = s => {

              <div class="heat-brand-row"><img src="${A}logo-denka-blue.png" alt="Denka logo"><span>St-NPMI-MAH Copolymer</span></div>
              <div class="heat-molecule"><div class="heat-node"><b>NPMI</b><span>Heat unit</span></div><div class="heat-node"><b>Sty</b><span>SAN affinity</span></div><div class="heat-node"><b>MAH</b><span>Interface</span></div></div>

    const deck = document.getElementById('deck');

    const sections = [...document.querySelectorAll('.slide')];
    const dotButtons = [...document.querySelectorAll('.dot')];
    function update() {
      document.body.classList.toggle('cover-mode', slides[current]?.type === 'coverImage');
      slideNo.textContent = `${String(current + 1).padStart(2,'0')} / ${slides.length}`;
      progress.style.width = `${((current + 1) / slides.length) * 100}%`;
      dotButtons.forEach((d,i)=>d.classList.toggle('active', i === current));
      document.title = `${slides[current].title.replace(/\\n/g, ' ')}｜中聚 FOCUSPOLY`;
    }
    function go(to) {
      const next = Math.max(0, Math.min(slides.length - 1, to));
      if (next === current || busy) return;
      busy = true;
      sections[current].classList.remove('active');
      sections[current].classList.toggle('prior', next > current);
      current = next;
      sections[current].classList.add('active');
      sections[current].classList.remove('prior');
      update();
      setTimeout(()=> busy = false, 650);
    }
    document.getElementById('prev').addEventListener('click', () => go(current - 1));
    document.getElementById('next').addEventListener('click', () => go(current + 1));
    dotButtons.forEach((d,i)=>d.addEventListener('click', () => go(i)));
    function isFullscreen() {
      return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
    }
    function updateFullscreenButton() {
      const active = isFullscreen();
      fullscreenBtn.textContent = active ? '×' : '⛶';
      fullscreenBtn.setAttribute('aria-label', active ? '退出全屏' : '全屏演示');
      fullscreenBtn.title = active ? '退出全屏' : '全屏演示';
      fullscreenBtn.classList.toggle('active', active);
    }
    async function toggleFullscreen() {
      if (fullscreenBtn.classList.contains('unsupported')) return;
      try {
        if (isFullscreen()) {
          if (document.exitFullscreen) await document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        } else {
          const target = document.documentElement;
          if (target.requestFullscreen) await target.requestFullscreen();
          else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        }
      } catch (err) {
        console.warn('Fullscreen request failed:', err);
      } finally {
        updateFullscreenButton();
      }
    }
    if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) {
      fullscreenBtn.classList.add('unsupported');
      fullscreenBtn.setAttribute('aria-label', '当前浏览器不支持全屏演示');
      fullscreenBtn.title = '当前浏览器不支持全屏演示';
    } else {
      fullscreenBtn.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', updateFullscreenButton);
      document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
      updateFullscreenButton();
    }
    window.addEventListener('keydown', e => {
      if (['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); go(current + 1); }
      if (['ArrowUp','ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); go(current - 1); }
      if (e.key === 'Home') go(0);
      if (e.key === 'End') go(slides.length - 1);
    });
    window.addEventListener('wheel', e => {
      if (matchMedia('(max-width: 980px)').matches) return;
      if (Math.abs(e.deltaY) < 24) return;
      go(current + (e.deltaY > 0 ? 1 : -1));
    }, { passive: true });
    update();
  </script>
</body>
</html>
